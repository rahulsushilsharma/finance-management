<!doctype html>
<html lang="en" style="background:#ffffff">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- theme-color updated dynamically via JS for dark mode; default matches light bg -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finance" />
    <title>FinanceApp</title>
    <style>
      /* prevent white flash — match light/dark background before JS loads */
      html { background: #ffffff; }
      @media (prefers-color-scheme: dark) { html { background: #0f172a; } }
      body { margin: 0; }
      /* full-screen splash shown until React mounts */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #ffffff;
        transition: opacity 0.2s ease;
      }
      @media (prefers-color-scheme: dark) { #splash { background: #0f172a; } }
      #splash img { width: 72px; height: 72px; border-radius: 18px; }
      #splash p { font-family: system-ui, sans-serif; font-size: 14px; color: #94a3b8; margin: 0; }
    </style>
  </head>
  <body>
    <!-- splash shown instantly, hidden once React mounts -->
    <div id="splash">
      <img src="/icons/icon-192.png" alt="FinanceApp" />
      <p>Loading…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
